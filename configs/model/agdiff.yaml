name: agdiff
adapter: src.models.agdiff.AGDiffAdapter
architecture:
  backbone: GIN
  gin_layers: 3
  detector_spectral_norm: false
  hidden_dim: 64
  latent_dim: ${dataset.latent_dim}
training:
  optimizer: Adam
  learning_rate: 0.001
  pretrain_epochs: 100
  joint_epochs: 200
  kl_coefficient: 0.001
  diffusion_steps: 1000
  lambda_diff: 1.0
  gradient_clip_norm: 5.0
  batch_size: ${dataset.batch_size}
