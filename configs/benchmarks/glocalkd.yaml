name: glocalkd
adapter: src.models.benchmarks.glocalkd.GLocalKDAdapter
architecture:
  hidden_dim: 512
  embedding_dim: 256
  gcn_layers: 3
  max_nodes: ${dataset.max_nodes}
  student_dropout: 0.1
training:
  epochs: 150
  learning_rate: 0.0001
  scheduler_step_size: 30
  scheduler_gamma: 0.1
  gradient_clip_norm: 1.0
role: benchmark
display_name: GLocalKD
