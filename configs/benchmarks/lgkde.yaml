name: lgkde
adapter: src.models.benchmarks.lgkde.LGKDEAdapter
architecture:
  hidden_dim: 32
  out_dim: 16
  num_layers: 2
  bandwidths:
  - 0.01
  - 0.1
  - 1
  - 10
  - 100
  dropout: 0.2
  batch_norm: true
  learn_kde_weights: true
negative_sampling:
  perturbation_methods:
  - feature_swap
  - structure
  attr_swap_ratio: 0.2
  threshold: 0.5
  weighted_graph: false
  big_energy_threshold: 0.5
  mid_energy_threshold: 0.75
  max_ratio: 10.0
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  epsilon: 1.0e-08
  reference_batch_size: 16
  mixed_anomaly_ratio: 0.0
role: benchmark
display_name: LGKDE
