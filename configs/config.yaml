defaults:
  - protocol: normal_only
  - suite: default
  - model: lgkde
  - dataset: mutag
  - _self_

project: glad-research
seed: 0
device: cuda
output_dir: outputs/runs/${model.name}/${dataset.name}/seed${seed}
reproducibility:
  deterministic: true
  split_seed_matches_run_seed: true
evaluation:
  score_orientation: higher_is_more_anomalous
  metrics: [auc, average_precision, f1, accuracy, latency_ms_per_graph, peak_cuda_memory_mb]
